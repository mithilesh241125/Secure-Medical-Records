{% extends "base.html" %}

{% block title %}Edit Patient - Secure Medical Records{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card">
            <div class="card-header">
                <h3>Edit Patient: {{ patient.name }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {{ form.csrf_token }}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ form.name.data or patient.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="mrn" class="form-label">Medical Record Number (MRN) *</label>
                                <input type="text" class="form-control" id="mrn" name="mrn" value="{{ form.medical_record_number.data or patient.medical_record_number }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth *</label>
                                <input type="date" class="form-control" id="dob" name="dob" value="{{ form.dob.data or patient.dob }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="gender" class="form-label">Gender *</label>
                                <select class="form-control" id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male" {% if (form.gender.data and form.gender.data == 'Male') or (not form.gender.data and patient.gender == 'Male') %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if (form.gender.data and form.gender.data == 'Female') or (not form.gender.data and patient.gender == 'Female') %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if (form.gender.data and form.gender.data == 'Other') or (not form.gender.data and patient.gender == 'Other') %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="blood_type" class="form-label">Blood Type</label>
                                <select class="form-control" id="blood_type" name="blood_type">
                                    <option value="">Select Blood Type</option>
                                    <option value="A+" {% if (form.blood_type.data and form.blood_type.data == 'A+') or (not form.blood_type.data and patient.blood_type == 'A+') %}selected{% endif %}>A+</option>
                                    <option value="A-" {% if (form.blood_type.data and form.blood_type.data == 'A-') or (not form.blood_type.data and patient.blood_type == 'A-') %}selected{% endif %}>A-</option>
                                    <option value="B+" {% if (form.blood_type.data and form.blood_type.data == 'B+') or (not form.blood_type.data and patient.blood_type == 'B+') %}selected{% endif %}>B+</option>
                                    <option value="B-" {% if (form.blood_type.data and form.blood_type.data == 'B-') or (not form.blood_type.data and patient.blood_type == 'B-') %}selected{% endif %}>B-</option>
                                    <option value="AB+" {% if (form.blood_type.data and form.blood_type.data == 'AB+') or (not form.blood_type.data and patient.blood_type == 'AB+') %}selected{% endif %}>AB+</option>
                                    <option value="AB-" {% if (form.blood_type.data and form.blood_type.data == 'AB-') or (not form.blood_type.data and patient.blood_type == 'AB-') %}selected{% endif %}>AB-</option>
                                    <option value="O+" {% if (form.blood_type.data and form.blood_type.data == 'O+') or (not form.blood_type.data and patient.blood_type == 'O+') %}selected{% endif %}>O+</option>
                                    <option value="O-" {% if (form.blood_type.data and form.blood_type.data == 'O-') or (not form.blood_type.data and patient.blood_type == 'O-') %}selected{% endif %}>O-</option>
                                    <option value="Unknown" {% if (form.blood_type.data and form.blood_type.data == 'Unknown') or (not form.blood_type.data and patient.blood_type == 'Unknown') %}selected{% endif %}>Unknown</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone" name="phone" value="{{ form.phone.data or patient.phone or '' }}">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ form.email.data or patient.email or '' }}">
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" name="address" rows="3">{{ form.address.data or patient.address or '' }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="allergies" class="form-label">Allergies</label>
                                <textarea class="form-control" id="allergies" name="allergies" rows="2">{{ form.allergies.data or patient.allergies or '' }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="emergency_contact_name" class="form-label">Emergency Contact Name</label>
                                <input type="text" class="form-control" id="emergency_contact_name" name="emergency_contact_name" value="{{ form.emergency_contact_name.data or patient.emergency_contact_name or '' }}">
                            </div>
                            <div class="mb-3">
                                <label for="emergency_contact_phone" class="form-label">Emergency Contact Phone</label>
                                <input type="text" class="form-control" id="emergency_contact_phone" name="emergency_contact_phone" value="{{ form.emergency_contact_phone.data or patient.emergency_contact_phone or '' }}">
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('main.view_patient', patient_id=patient.id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Patient</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
